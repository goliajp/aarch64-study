[package]
name = "aarch64-sim"
version = "0.16.0"
edition = "2021"
description = "AArch64 SoC simulator core (Rust → WASM) powering aarch64-study"
license = "MIT"
repository = "https://github.com/goliajp/aarch64-study"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
