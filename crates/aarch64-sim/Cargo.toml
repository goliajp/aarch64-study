[package]
name = "aarch64-sim"
version = "0.19.0"
edition = "2021"
description = "AArch64 SoC simulator core (Rust + WASM): two cores, MMU, AIC, virtio-blk-shaped block device, LL/SC, IPIs"
license = "MIT"
repository = "https://github.com/goliajp/aarch64-study"
homepage = "https://labs.golia.jp/aarch64/"
documentation = "https://docs.rs/aarch64-sim"
readme = "README.md"
keywords = ["aarch64", "arm64", "simulator", "emulator", "wasm"]
categories = ["emulators", "wasm", "command-line-utilities"]
include = [
    "/src/**/*.rs",
    "/examples/**/*.rs",
    "/examples/wasm-web/**",
    "/Cargo.toml",
    "/LICENSE",
    "/README.md",
]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "aarch64-sim"
path = "src/bin/cli.rs"
required-features = ["cli"]

[features]
default = []
# Re-export the simulator API to JS via wasm-bindgen + serde-wasm-bindgen.
# Enable this when running `wasm-pack build`.
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]
# Build the `aarch64-sim` CLI binary (uses clap + serde_json).
cli = ["dep:clap", "dep:serde_json"]

[dependencies]
serde = { version = "1", features = ["derive"] }
wasm-bindgen = { version = "0.2", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }
clap = { version = "4", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
